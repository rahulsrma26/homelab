# Immich (photos) + optional extras, based on Immich's own compose file, v3.3.1
# (https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml).
# Kiosk needs Immich ≥ v3.2, ImmichFrame ≥ v3 (both images are :latest).
# The library is mounted at /data: the database stores every file as /data/library/…,
# so this path must never change. Database and model cache live on the machine's own
# disk (fast); the library is a separate mount (e.g. an LXC bind mount from ZFS).
name: immich

services:
  immich-server:
    container_name: immich_server
    # v3: the newest 3.x on every update, never a jump to the next major version
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    devices:
      - /dev/dri:/dev/dri          # Intel iGPU: hardware transcoding (enable in Admin → Video transcoding)
    volumes:
      - type: bind                 # a missing mount stops the start instead of creating an empty folder
        source: ${UPLOAD_LOCATION}
        target: /data
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  # ── optional containers: each asked yes/no at install (COMPOSE_PROFILES in .env) ──

  # local machine learning (OpenVINO on the iGPU). With a faster ML server elsewhere,
  # list both in Admin → Machine Learning → URL: Immich tries them in order, so this one
  # is the fallback when the other is off. Without it (and without another ML server),
  # smart search, faces and duplicate detection don't run.
  immich-machine-learning:
    container_name: immich_machine_learning
    profiles: [ml-yes]
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_ML_VERSION:-v3-openvino}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:${VALKEY_VERSION:-9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d}
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:${IMMICH_POSTGRES_VERSION:-14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  # Immich Kiosk: a slideshow web page (:3502)
  immich-kiosk:
    profiles: [kiosk-yes]
    image: ghcr.io/damongolding/immich-kiosk:${IMMICH_KIOSK_VERSION:-0.45.2}
    container_name: immich_kiosk
    tty: true
    environment:
      LANG: ${KIOSK_LANG}
      TZ: ${TZ}
      KIOSK_IMMICH_API_KEY: ${KIOSK_IMMICH_API_KEY}
      KIOSK_IMMICH_URL: http://immich-server:2283
      # Clock
      KIOSK_SHOW_TIME: true
      KIOSK_TIME_FORMAT: 24
      KIOSK_SHOW_DATE: true
      KIOSK_DATE_FORMAT: DD-MMM
      KIOSK_CLOCK_SOURCE: client
      # Kiosk behaviour
      KIOSK_DURATION: 30
      KIOSK_DISABLE_SCREENSAVER: false
      KIOSK_OPTIMIZE_IMAGES: false
      KIOSK_USE_GPU: true
      # Image metadata
      KIOSK_SHOW_ALBUM_NAME: true
      KIOSK_SHOW_IMAGE_DATE: true
      KIOSK_IMAGE_DATE_FORMAT: YYYY-MM-DD
      KIOSK_SHOW_IMAGE_DESCRIPTION: true
      KIOSK_SHOW_IMAGE_LOCATION: true
    ports:
      - "3502:3000"
    volumes:
      - ${KIOSK_CONFIG_LOCATION}:/config
    restart: unless-stopped

  # ImmichFrame: a digital photo frame web page (:3503). Configure it at /admin
  # (connect it to Immich there); settings are stored in IMMICHFRAME_CONFIG_LOCATION.
  immichframe:
    profiles: [frame-yes]
    image: ghcr.io/immichframe/immichframe:${IMMICHFRAME_VERSION:-v1.0.39.0}
    container_name: immichframe
    environment:
      TZ: ${TZ}
      IMMICHFRAME_ADMIN_PASSWORD: ${IMMICHFRAME_ADMIN_PASSWORD}
    ports:
      - "3503:8080"
    volumes:
      - ${IMMICHFRAME_CONFIG_LOCATION}:/app/Config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Immich Power Tools: bulk tools (people merging, missing locations, …) (:3504).
  # Reads Immich's database directly, with the same DB_* values as the server.
  immich-power-tools:
    profiles: [powertools-yes]
    image: ghcr.io/immich-power-tools/immich-power-tools:${IMMICH_POWER_TOOLS_VERSION:-0.25.0}
    container_name: immich_power_tools
    environment:
      IMMICH_URL: http://immich-server:2283
      EXTERNAL_IMMICH_URL: ${EXTERNAL_IMMICH_URL}
      IMMICH_API_KEY: ${POWER_TOOLS_IMMICH_API_KEY}
      DB_HOST: immich_postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
    ports:
      - "3504:3000"
    volumes:
      - power-tools-data:/app/data
    depends_on:
      - database
    restart: unless-stopped

volumes:
  model-cache:
  power-tools-data:
