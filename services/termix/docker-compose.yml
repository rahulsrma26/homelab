services:
  termix:
    image: ghcr.io/lukegus/termix:${TERMIX_VERSION:-26.10.5}
    container_name: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:${GUACD_VERSION:-1.6.0}
    container_name: guacd
    restart: unless-stopped
    healthcheck:                         # the image's own check runs only every 5 minutes
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "4822"

