# Garage — S3-compatible object storage for rebuildable data (Forgejo's
# Actions artifacts, logs and packages). Path-style requests only.
services:
  garage:
    image: dxflrs/garage:${GARAGE_VERSION:-v2.4.1}
    container_name: garage
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "${S3_PORT}:3900"
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_DEFAULT_BUCKET}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - ${GARAGE_DIR}/meta:/meta
      - ${GARAGE_DIR}/data:/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
