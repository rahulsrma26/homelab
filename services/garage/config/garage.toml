# Single node: the layout, the bucket and its key are created at start
# from .env (garage server --single-node --default-bucket).
metadata_dir = "/meta"
data_dir = "/data"
db_engine = "sqlite"
replication_factor = 1

# RPC stays inside the container; the secret comes from GARAGE_RPC_SECRET.
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
