services:
  npm:
    image: jc21/nginx-proxy-manager:${NPM_VERSION:-2.16.0}
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${LETSENCRYPT_DIR:-./data/letsencrypt}:/etc/letsencrypt
