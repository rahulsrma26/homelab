services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - redisdata:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION:-3.3.4}
    restart: unless-stopped
    depends_on:
      - broker
      - gotenberg
      - tika
    ports:
      - "${PORT:-8075}:8000"
    volumes:
      - ${PAPERLESS_DIR}/data:/usr/src/paperless/data
      - ${PAPERLESS_DIR}/media:/usr/src/paperless/media
      - ${PAPERLESS_DIR}/export:/usr/src/paperless/export
      - ${CONSUME_DIR}:/usr/src/paperless/consume
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:${TIKA_VERSION:-4.1.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── optional (paperless_gpt = yes at install; COMPOSE_PROFILES in .env) ──

  # Paperless-GPT (:3002): OCR by a vision LLM, then title, tags, correspondent, date and custom
  # fields, for documents tagged paperless-gpt-ocr-auto / paperless-gpt-auto (README). Uses the
  # same OpenAI-compatible server and model as the built-in AI.
  paperless-gpt:
    profiles: [gpt-yes]
    image: icereed/paperless-gpt:${PAPERLESS_GPT_VERSION:-v0.31.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${GPT_PORT:-3002}:8080"
    environment:
      PAPERLESS_BASE_URL: http://webserver:8000
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      LLM_PROVIDER: openai
      LLM_MODEL: ${PAPERLESS_AI_LLM_MODEL}
      VISION_LLM_PROVIDER: openai
      VISION_LLM_MODEL: ${PAPERLESS_AI_LLM_MODEL}
      OPENAI_BASE_URL: ${PAPERLESS_AI_LLM_ENDPOINT}
      OPENAI_API_KEY: ${PAPERLESS_AI_LLM_API_KEY:-none}
      OCR_PROVIDER: llm
      OCR_LIMIT_PAGES: "0"
      OCR_SKIP_DIGITAL_PAGES: "true"
      LLM_LANGUAGE: ${PAPERLESS_GPT_LANGUAGE:-English}
    volumes:
      - ./paperless-gpt/prompts:/app/prompts
      - ./paperless-gpt/config:/app/config
      - ./paperless-gpt/db:/app/db
    depends_on:
      - webserver

volumes:
  redisdata:
