# Joplin Server (note sync) + its Postgres. Everything is in the database: back up the
# service folder (PBS) or a pg_dumpall.
services:
  joplin-db:
    image: postgres:16-alpine
    container_name: joplin-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=joplin
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
      - POSTGRES_DB=joplin
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joplin"]
      interval: 10s
      retries: 5

  joplin:
    image: joplin/server:${JOPLIN_VERSION}
    container_name: joplin
    restart: unless-stopped
    ports:
      - "${PORT:-22300}:22300"
    environment:
      - APP_PORT=22300
      - APP_BASE_URL=${JOPLIN_BASE_URL}
      - DB_CLIENT=pg
      - POSTGRES_HOST=joplin-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=joplin
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
      - POSTGRES_DATABASE=joplin
    depends_on:
      joplin-db:
        condition: service_healthy
