# Joplin Server (note sync) + its Postgres. Everything is in the database: back up the
# service folder (PBS) or a pg_dumpall.
services:
  joplin-db:
    image: postgres:${POSTGRES_VERSION:-16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab}
    container_name: joplin-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=joplin
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
      - POSTGRES_DB=joplin
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joplin"]
      interval: 10s
      retries: 5

  joplin:
    image: joplin/server:${JOPLIN_VERSION:-3.7.3@sha256:d951ce50b6d3d542393ebc4d08bd62d9a4fb0a6f6827abb861726c83560ecf97}
    container_name: joplin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:22300,path:'/api/ping',headers:{host:new URL(process.env.APP_BASE_URL).host}},r=>process.exit(r.statusCode==200?0:1)).on('error',()=>process.exit(1))"]
      # quick checks while starting, then every 2 min (each check is a line in the service's log)
      interval: 2m
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "${PORT:-22300}:22300"
    environment:
      - APP_PORT=22300
      - APP_BASE_URL=${JOPLIN_BASE_URL}
      - DB_CLIENT=pg
      - POSTGRES_HOST=joplin-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=joplin
      - POSTGRES_PASSWORD=${JOPLIN_DB_PASSWORD}
      - POSTGRES_DATABASE=joplin
    depends_on:
      joplin-db:
        condition: service_healthy
