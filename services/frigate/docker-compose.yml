services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION:-0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a}
    container_name: frigate
    # not privileged: the iGPU is its render device (below; Frigate runs as root in its
    # container, so it can open it); CAP_PERFMON lets intel_gpu_top read the GPU's load
    cap_add:
      - PERFMON
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "${SHM_SIZE:-512mb}"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_DIR:-./config}:/config
      - type: bind                 # a missing mount stops the start instead of creating an empty folder
        source: ${STORAGE_DIR:-/mnt/nvr}
        target: /media/frigate
        bind:
          create_host_path: false
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 500000000
    ports:
      - "${HTTP_PORT:-8971}:8971"
      - "${RTSP_PORT:-8554}:8554"
      - "${WEBRTC_PORT:-8555}:8555/tcp"
      - "${WEBRTC_PORT:-8555}:8555/udp"
    env_file: .env
    environment:
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD}"
