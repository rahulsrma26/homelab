# pkg-cache — a local cache for what every guest downloads again and again: Debian packages
# (apt-cacher-ng) and Docker Hub images (a pull-through registry mirror). Disposable: nothing
# in it needs a backup. Clients fall back to the internet when it's down (README).
services:
  apt-cacher-ng:
    build: ./apt-cacher-ng
    image: pkg-cache-apt:local
    container_name: pkg-cache-apt
    restart: unless-stopped
    ports:
      - "${APT_PORT:-3142}:3142"
    environment:
      - EX_THRESHOLD=${APT_KEEP_DAYS:-4}
      - APT_MAX_GB=${APT_MAX_GB:-40}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3142/acng-report.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${CACHE_DIR:-./cache}/apt:/var/cache/apt-cacher-ng

  # Docker Hub only: Docker's registry-mirrors setting applies to docker.io images
  registry-mirror:
    image: registry:${REGISTRY_VERSION:-3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e}
    container_name: pkg-cache-registry
    restart: unless-stopped
    ports:
      - "${MIRROR_PORT:-5000}:5000"
    environment:
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
      - REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io
      - REGISTRY_PROXY_TTL=${MIRROR_KEEP:-168h}
      - REGISTRY_PROXY_USERNAME=${DOCKER_HUB_USER:-}
      - REGISTRY_PROXY_PASSWORD=${DOCKER_HUB_TOKEN:-}
      - REGISTRY_STORAGE_DELETE_ENABLED=true
      - OTEL_TRACES_EXPORTER=none
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${CACHE_DIR:-./cache}/registry:/var/lib/registry
