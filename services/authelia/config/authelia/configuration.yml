server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  ldap:
    implementation: lldap
    address: ldap://lldap:3890
    base_dn: {{ env "LLDAP_BASE_DN" | quote }}
    additional_users_dn: ou=people
    users_filter: (&({username_attribute}={input})(objectclass=person))
    additional_groups_dn: ou=groups
    groups_filter: (member={dn})
    attributes:
      username: uid
      group_name: cn
      mail: mail
      display_name: cn
    user: {{ printf "uid=admin,ou=people,%s" (env "LLDAP_BASE_DN") | quote }}
    # Password supplied by AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD.

session:
  name: authelia_session
  cookies:
    - domain: {{ env "SESSION_DOMAIN" | quote }}
      authelia_url: {{ env "AUTH_URL" | quote }}
  expiration: 3600
  inactivity: 300
  remember_me: 1M

storage:
  local:
    path: /data/db.sqlite3

notifier:
  disable_startup_check: false
  filesystem:
    filename: /config/notification.txt

access_control:
  default_policy: two_factor

totp:
  issuer: {{ env "SESSION_DOMAIN" | quote }}
