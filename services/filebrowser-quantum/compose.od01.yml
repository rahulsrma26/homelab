# od01 variant: the vault, media and common mounts (vault read-only). Sources: config.od01.yaml.
services:
  filebrowser:
    # runs as root, the owner of the shared folders (the image defaults to uid 1000)
    user: "0:0"
    volumes:
      - ./cache:/cache
      - /mnt/vault:/srv/vault:ro
      - /mnt/media:/srv/media
      - /mnt/common:/srv/common
      - ./config.od01.yaml:/home/filebrowser/data/config.yaml:ro
