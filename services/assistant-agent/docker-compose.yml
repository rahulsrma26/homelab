services:

  # ── LLM + STT backend ────────────────────────────────────────────────────────
  # The model, its MTP draft head and alias come from compose.llm-<model>.yml.
  # Gemma 4 with mmproj enables vision and /v1/audio/transcriptions for STT.
  # reasoning=off is required — otherwise Gemma starts answers with its thinking.
  # The MTP head (draft-mtp) speeds up generation without changing the output.
  llama-cpp:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: assistant-llama
    restart: unless-stopped
    command: --host 0.0.0.0 --port 5050
      --n-gpu-layers 999
      --flash-attn on
      --parallel ${PARALLEL:-2}
      --batch-size ${BATCH_SIZE:-1024}
      --ubatch-size ${UBATCH_SIZE:-1024}
      --cache-type-k q8_0
      --cache-type-v q8_0
      --ctx-size ${CONTEXT_SIZE:-65536}
      --jinja
      --reasoning off
      --threads ${THREADS:-6}
      --spec-type draft-mtp
      --spec-draft-n-max ${DRAFT_N_MAX:-2}
    environment:
      LLAMA_CACHE: /models
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${LLAMA_PORT:-5050}:5050"
    # the image's own check expects port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 5s
      start_period: 15m
      retries: 3
    volumes:
      - ${MODELS_DIR:-/opt/generated/models}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Wyoming OpenAI bridge ─────────────────────────────────────────────────────
  # Translates Home Assistant's Wyoming protocol into OpenAI API calls: STT by the
  # LLM's audio projector, TTS from compose.tts-<engine>.yml. A second STT engine
  # gets its own Wyoming port from compose.stt-<engine>.yml. No GPU here.
  wyoming-openai:
    image: ghcr.io/roryeckel/wyoming_openai:${WYOMING_OPENAI_VERSION:-0.8.0}
    container_name: assistant-wyoming
    restart: unless-stopped
    environment:
      - WYOMING_LANGUAGES=${STT_LANGUAGE:-en}
      - STT_BACKEND=OPENAI
      - STT_OPENAI_URL=http://assistant-llama:5050/v1
      - STT_OPENAI_KEY=sk-dummy
      - STT_MODELS=gemma
      - STT_PROMPT=${STT_PROMPT}
      - STT_TEMPERATURE=0
    ports:
      - "${WYOMING_PORT:-10300}:10300"
    depends_on:
      - llama-cpp
