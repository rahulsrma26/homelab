# Reranker: Qwen3-Reranker 0.6B (Q8_0) on its own llama.cpp server, Jina-style /v1/rerank
# (e.g. LibreChat's web search with rerankerType jina and jinaApiUrl set to it, n8n). ~1.4 GB VRAM.
services:
  reranker:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b11870@sha256:334ddc356f5ad08dbf7eb6c98d1739a72e15b5cf452d1aeeae740c6625eb1226}
    container_name: assistant-rerank
    restart: unless-stopped
    # a query and one document are scored in one step: the batch must hold the longest pair
    command: --host 0.0.0.0 --port 5052
      --n-gpu-layers 999
      --reranking
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --ctx-size ${RERANK_CONTEXT_SIZE:-8192}
      --batch-size ${RERANK_BATCH_SIZE:-4096}
      --ubatch-size ${RERANK_BATCH_SIZE:-4096}
      --parallel ${RERANK_PARALLEL:-2}
      --threads ${THREADS:-6}
    environment:
      LLAMA_CACHE: /models
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_ARG_HF_REPO: ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF:Q8_0
      LLAMA_ARG_ALIAS: qwen3-reranker
    ports:
      - "${RERANK_PORT:-5052}:5052"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5052/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
    volumes:
      - ${MODELS_DIR:-/opt/generated/models}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
