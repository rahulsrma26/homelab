# Speech-to-text by Parakeet TDT (parakeet.cpp); the LLM only answers.
services:
  parakeet:
    build: ./parakeet
    image: assistant-parakeet:${PARAKEET_VERSION:-v0.6.1}
    container_name: assistant-parakeet
    restart: unless-stopped
    command: --model ${PARAKEET_MODEL} --cache-dir /models/parakeet --host 0.0.0.0 --port 8080 --threads ${THREADS:-6}
    volumes:
      - ${MODELS_DIR:-/opt/generated/models}:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  wyoming-openai:
    environment:
      - STT_OPENAI_URL=http://assistant-parakeet:8080/v1
      - STT_MODELS=parakeet-tdt-1.1b
    depends_on:
      - parakeet
