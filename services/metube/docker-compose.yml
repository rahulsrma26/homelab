services:
  metube:
    image: ghcr.io/alexta69/metube:${METUBE_VERSION:-2026.10.23@sha256:367d9d1b5122f2e88263a689998f8b11c4e9a188c9cbdace0ace8bd197935ad8}
    container_name: metube
    restart: unless-stopped
    ports:
      - "${PORT:-8083}:8081"
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
    environment:
      - DOWNLOAD_DIR=/downloads
      - TEMP_DIR=/downloads/.tmp
      - DELETE_FILE_ON_TRASHCAN=false
      - DEFAULT_THEME=${DEFAULT_THEME:-auto}
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
