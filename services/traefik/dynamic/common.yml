# Shared pieces the routes in routes.yml can use.
http:
  middlewares:
    # / and /dashboard → /dashboard/
    dashboard-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)(/|/dashboard)?$"
        replacement: "${1}/dashboard/"

    # dashboard login: admin / DASHBOARD_PASSWORD
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/auth/dashboard

    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000

    # the same, for apps that embed their own pages (e.g. as <object> or <iframe>): framing
    # by the same site only
    secure-headers-sameorigin:
      headers:
        customFrameOptionsValue: SAMEORIGIN
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000

  serversTransports:
    # for backends with self-signed certificates (Proxmox, PBS, TrueNAS)
    skip-verify:
      insecureSkipVerify: true
