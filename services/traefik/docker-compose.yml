# Traefik in one of two modes, chosen at install (COMPOSE_FILE in .env):
#   lan  the homelab's reverse proxy for LAN + Tailscale clients: HTTPS for every
#        <name>.DOMAIN with one wildcard certificate (Let's Encrypt DNS-01 at Cloudflare),
#        routes from files in ./dynamic, no Docker socket            → compose.lan.yml
#   cf   the public entry point behind a Cloudflare Tunnel (cloudflared → traefik →
#        containers on the "proxy" network), routes from Docker labels → compose.cf.yml
# This file holds what both share.
services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
