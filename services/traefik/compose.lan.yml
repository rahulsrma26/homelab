# lan mode: reverse proxy for the homelab (LAN + Tailscale). See docker-compose.yml.
services:
  # hashes DASHBOARD_PASSWORD for the dashboard login on every start
  dashboard-auth:
    image: httpd:2.4-alpine
    container_name: traefik-dashboard-auth
    restart: "no"
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    entrypoint: ["sh", "-c", 'test -n "$$DASHBOARD_PASSWORD" && htpasswd -nbB admin "$$DASHBOARD_PASSWORD" > /auth/dashboard']
    volumes:
      - ./auth:/auth
    network_mode: none

  traefik:
    depends_on:
      dashboard-auth:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - DOMAIN=${DOMAIN}
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --accesslog=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # drop look-alike headers (X_Forwarded_For for X-Forwarded-For)
      - --entrypoints.web.http.aliasHeadersStrategy=delete
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # no 60 s limit on uploads (Traefik v3's default)
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      # skip the local TXT check (routers that intercept DNS break it); wait instead
      - --certificatesresolvers.cloudflare.acme.dnschallenge.propagation.disableChecks=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.propagation.delayBeforeChecks=60s
      - --api.dashboard=true
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./letsencrypt:/letsencrypt
      - ./auth:/etc/traefik/auth:ro
