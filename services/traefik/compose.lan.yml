# lan mode: reverse proxy for the homelab (LAN + Tailscale). See docker-compose.yml.
services:
  # turns DASHBOARD_PASSWORD (.env) into the hashed file Traefik's basic auth reads, on
  # every start, so changing the password is: edit .env, labber traefik restart
  dashboard-auth:
    image: httpd:2.4-alpine
    container_name: traefik-dashboard-auth
    restart: "no"
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    entrypoint: ["sh", "-c", 'test -n "$$DASHBOARD_PASSWORD" && htpasswd -nbB admin "$$DASHBOARD_PASSWORD" > /auth/dashboard']
    volumes:
      - ./auth:/auth
    network_mode: none

  traefik:
    depends_on:
      dashboard-auth:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - DOMAIN=${DOMAIN}
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --accesslog=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # no time limit on reading a request: Traefik v3 cuts uploads off after 60 s by
      # default (a large file in Filebrowser, a long video into Immich). LAN-only proxy
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      # don't check the TXT record from here: a router that intercepts all DNS (UniFi ad
      # blocking / content filtering / DNS redirect) answers in Cloudflare's place and never
      # shows it. Let's Encrypt checks from the internet; wait a minute before asking it to.
      - --certificatesresolvers.cloudflare.acme.dnschallenge.propagation.disableChecks=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.propagation.delayBeforeChecks=60s
      - --api.dashboard=true
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./letsencrypt:/letsencrypt
      - ./auth:/etc/traefik/auth:ro
