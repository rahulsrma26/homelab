version: 1.3.11
cache: true

endpoints:
  custom:
    # two OpenAI-compatible servers: Qwen (LLAMA_* in .env; code, reasoning) and Gemma (LLAMA2_*; writing).
    # LibreChat doesn't read names from variables; keep the rest in sync with librechat.yaml
    - name: "Qwen"
      apiKey: "${LLAMA_API_KEY}"
      baseURL: "${LLAMA_BASE_URL}/v1/"
      # thinking models: a moderate effort (servers without reasoning ignore it)
      addParams:
        reasoning_effort: "medium"
      models:
        default:
          - "local-model"   # shown only while the server's list can't be fetched
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      modelDisplayLabel: "Qwen"

    - name: "Gemma"
      apiKey: "${LLAMA2_API_KEY}"
      baseURL: "${LLAMA2_BASE_URL}/v1/"
      models:
        default:
          - "local-model-2"   # shown only while the server's list can't be fetched
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      modelDisplayLabel: "Gemma"

# web search: SearXNG finds pages, Firecrawl reads them, a Jina-compatible reranker picks the best parts
# (the names come from extra_hosts in docker-compose.yml; allowedAddresses lets them reach private addresses)
webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  scraperProvider: "firecrawl"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  rerankerType: "jina"
  jinaApiUrl: "${JINA_API_URL}"
  jinaApiKey: "${JINA_API_KEY}"
  allowedAddresses:
    - "librechat-searxng:5080"
    - "librechat-firecrawl:3002"
    - "librechat-reranker:5052"

mcpServers:
  searxng:
    type: stdio
    command: npx
    args:
      - "-y"
      - "mcp-searxng"
    env:
      SEARXNG_URL: "${SEARXNG_INSTANCE_URL}"
