version: 1.3.11
cache: true

endpoints:
  custom:
    - name: "llama.cpp"
      apiKey: "sk-dummy"
      baseURL: "${LLAMA_BASE_URL}/v1/"
      models:
        default:
          - "${LLAMA_MODEL:-gemma-4-12b-it}"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      modelDisplayLabel: "llama.cpp"

webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"

mcpServers:
  searxng:
    type: stdio
    command: npx
    args:
      - "-y"
      - "mcp-searxng"
    env:
      SEARXNG_URL: "${SEARXNG_INSTANCE_URL}"
