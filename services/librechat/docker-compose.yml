services:

  # ── App ───────────────────────────────────────────────────────────────────────
  librechat:
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    container_name: librechat
    restart: unless-stopped
    depends_on:
      - mongodb
      - meilisearch
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-3080}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-http://localhost:3080}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-http://localhost:3080}
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - SEARCH=true
      - TRUST_PROXY=1
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - librechat-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Admin panel ───────────────────────────────────────────────────────────────
  librechat-admin:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    container_name: librechat-admin
    restart: unless-stopped
    depends_on:
      - librechat
    environment:
      - PORT=3000
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://librechat:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
    ports:
      - "${ADMIN_PANEL_PORT:-3003}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # ── Database ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.0.20
    container_name: librechat-mongodb
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data/mongodb:/data/db
    command: mongod --noauth
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # ── Search ────────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: librechat-meilisearch
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./data/meilisearch:/meili_data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  librechat-data:
