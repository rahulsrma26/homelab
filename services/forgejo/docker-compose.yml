services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-15.0.11@sha256:5d050e6d623e540923ff54b1c0c7acf41c3f9174a6c7ad515cc0c63d703fcd22}
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__database__PATH=/data/gitea/forgejo.db
      - FORGEJO__server__DOMAIN=${FORGEJO_DOMAIN}
      - FORGEJO__server__ROOT_URL=${FORGEJO_SCHEME:-https}://${FORGEJO_DOMAIN}/
      - FORGEJO__server__SSH_DOMAIN=${FORGEJO_SSH_HOST}
      - FORGEJO__server__SSH_PORT=${SSH_PORT}
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES=${TRAEFIK_IP}
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=${REQUIRE_SIGNIN_VIEW:-true}
      - FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION=false
      - FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION_API=false
      - FORGEJO__repository__DEFAULT_PRIVATE=private
      - FORGEJO__actions__ENABLED=true
      - FORGEJO__actions__ARTIFACT_RETENTION_DAYS=${ARTIFACT_RETENTION_DAYS}
      - FORGEJO__actions__LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS}
      - FORGEJO__packages__ENABLED=${PACKAGES_ENABLED}
    ports:
      - "${HTTP_PORT}:3000"
      - "${SSH_PORT}:22"
    volumes:
      - ${FORGEJO_DATA}:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/healthz"]
      # quick checks while starting, then every 2 min (each check is a line in the service's log)
      interval: 2m
      start_interval: 5s
      timeout: 5s
      start_period: 1m
      retries: 3
