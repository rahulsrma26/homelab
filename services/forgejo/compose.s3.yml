# Actions artifacts and packages in an S3 bucket (path-style, plain HTTP);
# Actions logs stay in FORGEJO_DATA.
services:
  forgejo:
    environment:
      - FORGEJO__packages__STORAGE_TYPE=minio
      - FORGEJO__packages__MINIO_ENDPOINT=${S3_ENDPOINT}
      - FORGEJO__packages__MINIO_BUCKET=${S3_BUCKET}
      - FORGEJO__packages__MINIO_LOCATION=${S3_REGION}
      - FORGEJO__packages__MINIO_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - FORGEJO__packages__MINIO_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - FORGEJO__packages__MINIO_USE_SSL=false
      - FORGEJO__packages__MINIO_BUCKET_LOOKUP=path
      - FORGEJO__actions_0X2E_artifacts__STORAGE_TYPE=minio
      - FORGEJO__actions_0X2E_artifacts__MINIO_ENDPOINT=${S3_ENDPOINT}
      - FORGEJO__actions_0X2E_artifacts__MINIO_BUCKET=${S3_BUCKET}
      - FORGEJO__actions_0X2E_artifacts__MINIO_LOCATION=${S3_REGION}
      - FORGEJO__actions_0X2E_artifacts__MINIO_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - FORGEJO__actions_0X2E_artifacts__MINIO_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - FORGEJO__actions_0X2E_artifacts__MINIO_USE_SSL=false
      - FORGEJO__actions_0X2E_artifacts__MINIO_BUCKET_LOOKUP=path
