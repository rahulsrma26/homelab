groups:
  # always firing: Alertmanager sends it every minute to an outside watcher (WATCHDOG_URL, e.g.
  # an Uptime Kuma push monitor), which alerts when it stops: Prometheus, its rules or Alertmanager down
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "The alert path works (Prometheus → Alertmanager → the outside watcher)"

  - name: proxmox-hosts
    rules:
      # Targets Prometheus scrapes itself (pve-exporter, prometheus)
      - alert: HostDown
        expr: up{job!="traefik"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is down"

      # Traefik's metrics port: only the certificate-expiry data (Traefik itself down shows everywhere)
      - alert: CertMetricsUnreachable
        expr: up{job="traefik"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Traefik's metrics at {{ $labels.instance }} can't be read: certificate expiry isn't checked (firewall, or the metrics port)"

      # Hosts and guests that PUSH metrics with Alloy never report up == 0 when they
      # die — their samples just stop. Remember each host for a day after its last
      # sample; after that it is forgotten (expiry does not establish recovery).
      # When a Proxmox host goes silent, its guests do too: only the host alerts, not each guest.
      # Guests are matched to their host by name (pve-exporter's guest list, remembered for a
      # day, since a dead host can't be asked): a guest's Proxmox name must equal its hostname.
      - alert: HostNotReporting
        expr: |
          (max by (instance) (max_over_time(node_boot_time_seconds[1d])) unless max by (instance) (node_boot_time_seconds))
          unless on(instance)
          (
            label_replace(max by (name, node) (max_over_time(pve_guest_info[1d])), "instance", "$1", "name", "(.*)")
            * on(node) group_left()
            label_replace(
              max by (instance) (max_over_time(node_boot_time_seconds[1d])) unless max by (instance) (node_boot_time_seconds),
              "node", "$1", "instance", "(.*)"
            )
          )
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} stopped sending metrics (down, or Alloy stopped)"

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.name }} failed on {{ $labels.instance }}"

  # metrics from labber setup's health check (/usr/local/sbin/labber-health-check)
  - name: guests
    rules:
      - alert: RebootRequired
        expr: labber_reboot_required == 1
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} has had a newer kernel or GPU driver installed for over a day — reboot it"

      - alert: ServicesNeedRestart
        expr: labber_restart_required_services > 0
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }}: {{ $value }} service(s) still run outdated libraries — reboot, or: sudo needrestart -r a"

      - alert: SecurityUpdatesStuck
        expr: labber_security_updates_pending > 0
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: {{ $value }} security update(s) pending for a week — automatic updates may be failing"

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High CPU on {{ $labels.instance }}: {{ $value | printf \"%.0f\" }}%"

      # memory staying high: hosts and VMs from their own MemAvailable; LXCs from the host's view
      # (pve-exporter), since inside an LXC the node metrics would show the host's memory
      - alert: HighMemory
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
          or
          label_replace(
            (pve_memory_usage_bytes{id=~"lxc/.*"} / pve_memory_size_bytes{id=~"lxc/.*"} * 100) * on(id) group_left(name) pve_guest_info,
            "instance", "$1", "name", "(.*)"
          ) > 90
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has used over 90% of its memory for 30 min: {{ $value | printf \"%.0f\" }}%"

      # disk space in steps: an early note in the daily digest, then critical (at once)
      # not from LXCs: the host already reports every dataset (each LXC's root disk is its
      # subvol-<id>-disk-0; bind-mounted datasets are the host's own), so they'd count twice or more
      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs", kind!="lxc"} / node_filesystem_size_bytes{fstype!="tmpfs", kind!="lxc"})) * 100 > 80
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} at {{ $value | printf \"%.0f\" }}%, filling up"

      - alert: DiskSpaceCritical
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs", kind!="lxc"} / node_filesystem_size_bytes{fstype!="tmpfs", kind!="lxc"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} at {{ $value | printf \"%.0f\" }}%"

      - alert: DiskSpaceFull
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs", kind!="lxc"} / node_filesystem_size_bytes{fstype!="tmpfs", kind!="lxc"})) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} nearly full: {{ $value | printf \"%.0f\" }}%"

      # a runaway log or copy: at the rate of the last 6 h, full within a day (only disks
      # already over half full, and only a trend that holds for an hour)
      # still filling in the last hour too: a finished burst (a new guest set up, images pulled) is no alarm
      - alert: DiskFillingFast
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!="tmpfs", kind!="lxc"}[6h], 24 * 3600) < 0
          and predict_linear(node_filesystem_avail_bytes{fstype!="tmpfs", kind!="lxc"}[1h], 24 * 3600) < 0
          and (1 - (node_filesystem_avail_bytes{fstype!="tmpfs", kind!="lxc"} / node_filesystem_size_bytes{fstype!="tmpfs", kind!="lxc"})) * 100 > 50
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will be full within a day at the rate of the last 6 h"

      # a physical disk on a Proxmox host writes far more than usual: a runaway process wearing out
      # an SSD. Hosts only: guests see virtual disks, and LXCs see the host's disks again.
      # Per disk serial, hour by hour: kernel names (nvme0n1, sda) can swap at a reboot (topk: old
      # and new disk info overlap for a few minutes after it)
      - alert: DiskWritesSurge
        expr: |
          avg_over_time((max by (instance, serial, model) (rate(node_disk_written_bytes_total{job="proxmox-node-exporters", device=~"nvme[0-9]+n[0-9]+|sd[a-z]+"}[1h]) * on (instance, device) group_left (serial, model) topk by (instance, device) (1, node_disk_info)))[1d:1h]) * 86400 > 50e9
          and
          avg_over_time((max by (instance, serial, model) (rate(node_disk_written_bytes_total{job="proxmox-node-exporters", device=~"nvme[0-9]+n[0-9]+|sd[a-z]+"}[1h]) * on (instance, device) group_left (serial, model) topk by (instance, device) (1, node_disk_info)))[1d:1h])
            > 3 * avg_over_time((max by (instance, serial, model) (rate(node_disk_written_bytes_total{job="proxmox-node-exporters", device=~"nvme[0-9]+n[0-9]+|sd[a-z]+"}[1h]) * on (instance, device) group_left (serial, model) topk by (instance, device) (1, node_disk_info)))[7d:1h] offset 1d)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.model }} ({{ $labels.serial }}) wrote {{ $value | humanize1024 }}B in 24 h, over 3× its usual day"

      - alert: SmartDriveWear
        expr: smartctl_device_percentage_used > 80
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Drive wear {{ $value }}% on {{ $labels.instance }} device {{ $labels.device }}"

      - alert: SmartHealthFailed
        expr: smartctl_device_smart_status != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART health FAILED on {{ $labels.instance }} device {{ $labels.device }}"

  # memory (EDAC: ECC / IB-ECC) and ZFS pools, pushed by Alloy from the Proxmox hosts
  - name: hardware
    rules:
      # data may already be wrong: act at once
      - alert: MemoryUncorrectableError
        expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Uncorrectable memory (ECC) error on {{ $labels.instance }}, memory controller {{ $labels.controller }}"

      # one corrected error now and then is normal; a steady stream means a failing module
      - alert: MemoryCorrectableErrors
        expr: increase(node_edac_correctable_errors_total[24h]) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} corrected memory (ECC) errors in 24h on {{ $labels.instance }}, memory controller {{ $labels.controller }}"

      - alert: ZfsPoolNotOnline
        expr: node_zfs_zpool_state{state!="online"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is {{ $labels.state }}"

      # the chipset (PCH) by its sensor's label, not its number (the number can change at a reboot);
      # Intel's chipsets allow about 100 °C: 90 °C held for 10 minutes means too little airflow
      - alert: ChipsetTemperatureHigh
        expr: |
          min_over_time((max by (instance) (node_hwmon_temp_celsius * on (instance, chip, sensor) group_left node_hwmon_sensor_label{label=~"(?i)pch_chip_temp|pch_temp"}))[10m:1m]) >= 90
        labels:
          severity: warning
        annotations:
          summary: "The chipset (PCH) on {{ $labels.instance }} has been at {{ printf \"%.0f\" $value }} °C or more for 10 minutes: check its airflow (fans)"

      - alert: ChipsetTemperatureCritical
        expr: |
          min_over_time((max by (instance) (node_hwmon_temp_celsius * on (instance, chip, sensor) group_left node_hwmon_sensor_label{label=~"(?i)pch_chip_temp|pch_temp"}))[5m:1m]) >= 95
        labels:
          severity: critical
        annotations:
          summary: "The chipset (PCH) on {{ $labels.instance }} is at {{ printf \"%.0f\" $value }} °C (its limit is about 100 °C): more airflow now, or shut down"

  # NVIDIA GPUs (labber setup's gpu step: /usr/local/sbin/labber-gpu-metrics)
  - name: gpu
    rules:
      # a short peak to 95 °C, or 90 °C and more for 15 minutes without a break
      - alert: GPUTemperatureHigh
        expr: gpu_temperature_celsius >= 95 or min_over_time(gpu_temperature_celsius[15m]) >= 90
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.name }} on {{ $labels.instance }} is at {{ printf \"%.0f\" $value }} °C (95 °C, or 90 °C for 15 minutes)"

  # container metrics pushed by Alloy on Docker hosts (job guest-containers)
  - name: containers
    rules:
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{job="guest-containers"}[15m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.instance }} restarted {{ $value }} times in 15 minutes"

      # was running 10 minutes ago, isn't now (stopped, crashed for good, or removed).
      # Clears by itself once it's been gone longer than the window.
      - alert: ContainerGone
        expr: max by (instance, name) (container_last_seen{job="guest-containers"} offset 10m) unless max by (instance, name) (container_last_seen{job="guest-containers"})
        labels:
          severity: info
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.instance }} stopped (or was removed)"

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{job="guest-containers"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.instance }} ran out of memory and was killed"

      # from `labber check-updates` (daily on Docker hosts) — a weekly note, not a page
      - alert: ServiceUpdateAvailable
        expr: max by (instance, service) (labber_service_update_available) == 1
        for: 1d
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.instance }} has an update — labber {{ $labels.service }} update"

  # automation: labber sync on enrolled guests, the gatekeeper on the Forgejo guest
  - name: automation
    rules:
      - alert: ConfigSyncRefused
        expr: max by (instance) (labber_sync_refused) == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} refused a release (a signature, the stage or a backwards move didn't check out): nothing applied — labber sync status"

      - alert: ConfigSyncRollbackFailed
        expr: max by (instance, service) (labber_sync_rollback_failed) == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.instance }}: an update failed and so did its rollback — the service is down"

      - alert: ConfigSyncFailed
        expr: max by (instance, service) (labber_sync_failed) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.instance }}: an update failed and was rolled back (not retried until a newer version)"

      - alert: ConfigSyncStale
        expr: (time() - max by (instance) (labber_sync_last_success_timestamp) > 3600) unless on (instance) (max by (instance) (labber_sync_forgejo_unreachable) == 1)
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} hasn't synced successfully for an hour"

      # syncs succeed but the guest still sees an older release record than the gatekeeper
      # published (a frozen or replayed feed, or a releases branch it can't fetch)
      - alert: ReleaseFeedBehind
        expr: max by (instance, stage) (labber_sync_record_seq) < on (stage) group_left max by (stage) (gatekeeper_record_seq)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is on {{ $labels.stage }} record {{ $value }} for 2 hours, older than the gatekeeper's: a frozen feed?"

      # one alert for every guest that can't reach Forgejo (they keep running what they have)
      - alert: ConfigSyncForgejoUnreachable
        expr: count(max by (instance) (labber_sync_forgejo_unreachable) == 1) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} guest(s) haven't reached Forgejo for an hour: they keep running what they have; sync resumes by itself"

      - alert: ServiceUnhealthy
        expr: max by (instance, service) (labber_service_healthy) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.instance }} is unhealthy (a container unhealthy, restarting or exited)"

      - alert: ConfigSyncNeedsYou
        expr: max by (instance, service, why) (labber_sync_waiting{why=~"needs settings.*"}) == 1
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.instance }} waits for you: {{ $labels.why }}"

      - alert: ConfigSyncHeld
        expr: time() - max by (instance, service) (labber_sync_hold) > 7 * 86400
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.service }} has been on hold for over a week — labber sync release"

      - alert: UpdateReady
        expr: max by (instance, service) (labber_sync_ready) == 1
        for: 14d
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service }} on {{ $labels.instance }}: an update has been ready for two weeks (the maintenance queue)"

      - alert: PromotionStuck
        expr: max(gatekeeper_promotion_waiting_seconds) > 86400
        labels:
          severity: warning
        annotations:
          summary: "canary → main has been waiting over a day (no positive evidence from the canary)"

      - alert: GatekeeperNotRunning
        expr: time() - max(gatekeeper_last_run_timestamp) > 900 or max(gatekeeper_last_run_ok) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "the gatekeeper hasn't run cleanly for 15 minutes (journalctl -u gatekeeper on the Forgejo guest)"

  # logs: Alloy's own counters (every host) and Loki's; all warnings, for the digest
  - name: certificates
    rules:
      # Let's Encrypt renews 30 days ahead: under 20 days left, renewal has been failing for 10
      - alert: CertificateExpiresSoon
        expr: min by (instance, cn) (traefik_tls_certs_not_after) - time() < 20 * 86400
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.cn }} (Traefik on {{ $labels.instance }}) expires in {{ $value | humanizeDuration }}: renewal is failing"

      - alert: CertificateExpiresVerySoon
        expr: min by (instance, cn) (traefik_tls_certs_not_after) - time() < 5 * 86400
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.cn }} (Traefik on {{ $labels.instance }}) expires in {{ $value | humanizeDuration }}"
  - name: backups
    rules:
      # sanoid stopped (or lost a dataset): its newest snapshot is over a day old. From
      # backup-age-metrics on each host (install-exporters.sh)
      - alert: SnapshotsStale
        expr: time() - zfs_snapshot_newest_timestamp > 26 * 3600
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.dataset }} on {{ $labels.instance }}: no sanoid snapshot for {{ $value | humanizeDuration }}"

      # a guest that exists (pve-exporter lists it) and has backups, but none in over a day
      - alert: BackupStale
        expr: |
          (time() - max by (instance, vmid) (pve_backup_newest_timestamp) > 26 * 3600)
            and on (vmid) label_replace(max by (id) (pve_guest_info), "vmid", "$1", "id", ".*/([0-9]+)")
        labels:
          severity: warning
        annotations:
          summary: "guest {{ $labels.vmid }} (backed up from {{ $labels.instance }}): no backup for {{ $value | humanizeDuration }}"

      - alert: BackupAgeMetricsStale
        expr: time() - max by (instance) (backup_age_metrics_last_run_timestamp) > 3 * 3600
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }}: the backup-age check hasn't run for 3 hours (backup-age-metrics.timer)"

  - name: logs
    rules:
      # a host hit its cap (100 lines/s per container, 50 per journal unit): something is spamming
      - alert: LogsCapped
        expr: sum by (host) (increase(loki_process_dropped_lines_total{reason="ratelimit_drop_stage"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} is logging more than its cap: {{ $value | humanize }} lines dropped in 15 minutes — check its noisiest container"

      # logs that left a host but never arrived (Loki rejected them, or the queue overflowed)
      - alert: LogsNotDelivered
        expr: sum by (host, reason) (increase(loki_write_dropped_entries_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: {{ $value | humanize }} log lines lost in 15 minutes ({{ $labels.reason }})"

      # sustained heavy logging, even under the cap (~8.6 GB a day at this rate; normal is a few MB)
      - alert: LogFlood
        expr: sum by (host) (rate(loki_write_sent_bytes_total[15m])) > 100e3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} sends {{ $value | humanize }}B/s of logs — check its noisiest container"

      # Loki itself turned lines away (its own limits, behind the hosts' caps)
      - alert: LokiRejectingLogs
        expr: sum by (reason) (increase(loki_discarded_samples_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Loki rejected {{ $value | humanize }} log lines in 15 minutes ({{ $labels.reason }})"
