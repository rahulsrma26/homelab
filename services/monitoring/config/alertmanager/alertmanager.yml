global:
  resolve_timeout: 5m

# Three levels, two Telegram chats:
#   critical (host down, pool degraded, disk failing or full, uncorrectable ECC): the loud
#     chat (TELEGRAM_BOT_TOKEN/CHAT_ID) at once, then every 6 h while it lasts
#   warning (strong signals to act on within a day: a failed service, a restart loop, drive
#     wear, a write surge, logs flooding): the quiet chat (TELEGRAM_MANAGER_*) at once, then
#     daily while it lasts
#   info (routine: reboot due, update available, disk 80 %): the quiet chat, once a day at
#     15:00 UTC as one digest, then weekly
# Without TELEGRAM_MANAGER_* set, the quiet messages go to the loud chat.
route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  receiver: 'critical'
  routes:
    - matchers: ['severity = critical']
      repeat_interval: 6h
      receiver: 'critical'
    - matchers: ['severity = warning']
      group_wait: 1m
      repeat_interval: 24h
      receiver: 'manager'
    # one message per digest with every note that is firing
    - matchers: ['severity = info']
      group_by: ['severity']
      active_time_intervals: ['daily-digest']
      repeat_interval: 167h
      receiver: 'manager'

time_intervals:
  - name: daily-digest
    time_intervals:
      - times:
          - start_time: '15:00'
            end_time: '15:30'
        location: 'UTC'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  # disk space: only the highest step for a disk (Full > Critical > Low)
  - source_matchers: ['alertname = DiskSpaceFull']
    target_matchers: ['alertname =~ "DiskSpaceCritical|DiskSpaceLow"']
    equal: ['instance', 'mountpoint']
  - source_matchers: ['alertname = DiskSpaceCritical']
    target_matchers: ['alertname = DiskSpaceLow']
    equal: ['instance', 'mountpoint']

receivers:
  - name: 'critical'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        message: |
          {{ range .Alerts }}
          *{{ .Status | toUpper }}* {{ .Labels.alertname }}
          Instance: {{ .Labels.instance }}
          {{ .Annotations.summary }}
          {{ end }}
        parse_mode: Markdown
  - name: 'manager'
    telegram_configs:
      - bot_token: '${TELEGRAM_MANAGER_BOT_TOKEN}'
        chat_id: ${TELEGRAM_MANAGER_CHAT_ID}
        message: |
          {{ range .Alerts }}
          *{{ .Status | toUpper }}* {{ .Labels.alertname }}
          Instance: {{ .Labels.instance }}
          {{ .Annotations.summary }}
          {{ end }}
        parse_mode: Markdown
