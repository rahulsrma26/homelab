services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    container_name: grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
      - influxdb

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    container_name: prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "9090:9090"
    environment:
      - PVE_HOSTS=${PVE_HOSTS:-}
    # writes the Proxmox hosts from .env (PVE_HOSTS, comma-separated) as a file_sd target list,
    # so prometheus.yml stays the same everywhere and updates never touch your hosts
    entrypoint:
      - /bin/sh
      - -c
      - 'mkdir -p /tmp/targets && hosts=$$(echo "$$PVE_HOSTS" | tr "," " ") && { if [ -n "$$hosts" ]; then echo "- targets:"; for h in $$hosts; do echo "    - \"$$h\""; done; else echo "[]"; fi; } > /tmp/targets/pve.yml && exec /bin/prometheus "$$@"'
      - prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=20GB'
      - '--web.enable-remote-write-receiver'
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus:/etc/prometheus

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.0}
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      # a named volume, or a path: its own dataset with a quota, so a log flood can't fill Prometheus's disk
      - ${LOKI_DATA:-loki-data}:/loki
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml

  influxdb:
    image: influxdb:${INFLUXDB_VERSION:-2.7}
    container_name: influxdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=homelab
      - DOCKER_INFLUXDB_INIT_BUCKET=homeassistant
      - DOCKER_INFLUXDB_INIT_RETENTION=365d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2     # the CLI config (otherwise a new anonymous volume at each recreate)

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.27.0}
    container_name: alertmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - ALERT_TARGET=${ALERT_TARGET:-telegram}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_MANAGER_BOT_TOKEN=${TELEGRAM_MANAGER_BOT_TOKEN:-}
      - TELEGRAM_MANAGER_CHAT_ID=${TELEGRAM_MANAGER_CHAT_ID:-}
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-alerts}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
    # fills the settings into the config: Telegram (the quiet chat falls back to the loud one),
    # or with ALERT_TARGET=ntfy the receivers from receivers-ntfy.yml (the routes stay the same)
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        src=/etc/alertmanager/tmpl/alertmanager.yml
        if [ "$$ALERT_TARGET" = ntfy ]; then
          sed '/^receivers:/,$$d' "$$src" > /tmp/routes.yml
          cat /etc/alertmanager/tmpl/receivers-ntfy.yml >> /tmp/routes.yml
          src=/tmp/routes.yml
        fi
        mt="$${TELEGRAM_MANAGER_BOT_TOKEN:-$$TELEGRAM_BOT_TOKEN}"; mc="$${TELEGRAM_MANAGER_CHAT_ID:-$$TELEGRAM_CHAT_ID}"
        sed "s|\$${TELEGRAM_MANAGER_BOT_TOKEN}|$$mt|g; s|\$${TELEGRAM_MANAGER_CHAT_ID}|$$mc|g; s|\$${TELEGRAM_BOT_TOKEN}|$$TELEGRAM_BOT_TOKEN|g; s|\$${TELEGRAM_CHAT_ID}|$$TELEGRAM_CHAT_ID|g; s|\$${NTFY_URL}|$$NTFY_URL|g; s|\$${NTFY_TOPIC}|$$NTFY_TOPIC|g; s|\$${NTFY_TOKEN}|$$NTFY_TOKEN|g" "$$src" > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    user: root
    volumes:
      - ./config/alertmanager:/etc/alertmanager/tmpl:ro
      - alertmanager-data:/alertmanager

  pve-exporter:
    image: prompve/prometheus-pve-exporter:${PVE_EXPORTER_VERSION:-3.5.1}
    container_name: pve-exporter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9221/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - PVE_USER=${PVE_USER}
      - PVE_PASSWORD=${PVE_PASSWORD}
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL}

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  influxdb-data:
  influxdb-config:
  alertmanager-data:
