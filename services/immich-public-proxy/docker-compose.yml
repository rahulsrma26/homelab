services:
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:latest
    container_name: immich-public-proxy
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - IMMICH_URL=${IMMICH_URL}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich-public-proxy.rule=Host(`${PUBLIC_HOSTNAME}`)
      - traefik.http.routers.immich-public-proxy.entrypoints=web
      - traefik.http.services.immich-public-proxy.loadbalancer.server.port=3000
      - traefik.http.routers.immich-public-proxy.middlewares=ipp-headers@docker,ipp-rate-limit@docker
      # Security headers
      - traefik.http.middlewares.ipp-headers.headers.frameDeny=true
      - traefik.http.middlewares.ipp-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.ipp-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      # Rate limiting
      - traefik.http.middlewares.ipp-rate-limit.ratelimit.average=100
      - traefik.http.middlewares.ipp-rate-limit.ratelimit.burst=50
      - traefik.http.middlewares.ipp-rate-limit.ratelimit.period=60s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  proxy:
    name: proxy
    external: true
