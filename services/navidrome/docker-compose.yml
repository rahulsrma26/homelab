# Navidrome — music server (web UI + Subsonic API for apps). The music library is
# mounted read-only; Navidrome keeps its database and cache in ./data.
services:
  navidrome:
    image: deluan/navidrome:${NAVIDROME_VERSION:-0.64.2}
    container_name: navidrome
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: "${PUID}:${PGID}"
    ports:
      - "${PORT:-4533}:4533"
    environment:
      - ND_MUSICFOLDER=${MUSIC_FOLDER}
      - ND_LOGLEVEL=warning
      - ND_SCANNER_GROUPALBUMRELEASES=true
      - TZ=${TZ}
    volumes:
      - ./data:/data
      - type: bind                 # a missing mount stops the start instead of creating an empty folder
        source: ${MUSIC_DIR}
        target: /music
        read_only: true
        bind:
          create_host_path: false
