# Navidrome — music server (web UI + Subsonic API for apps). The music library is
# mounted read-only; Navidrome keeps its database and cache in ./data.
services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "${PORT:-4533}:4533"
    environment:
      - ND_MUSICFOLDER=${MUSIC_FOLDER}
      - ND_LOGLEVEL=warning
      - ND_SCANNER_GROUPALBUMRELEASES=true
      - TZ=${TZ}
    volumes:
      - ./data:/data
      - type: bind                 # a missing mount stops the start instead of creating an empty folder
        source: ${MUSIC_DIR}
        target: /music
        read_only: true
        bind:
          create_host_path: false
