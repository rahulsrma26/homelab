# Stateless web tools.
services:
  # IT-Tools, the maintained fork
  it-tools:
    image: ghcr.io/sharevb/it-tools:${IT_TOOLS_VERSION:-2026.9.27}
    container_name: it-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${IT_TOOLS_PORT:-7001}:8080"

  omni-tools:
    image: iib0011/omni-tools:${OMNI_TOOLS_VERSION:-0.7.0}
    container_name: omni-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${OMNI_TOOLS_PORT:-7002}:80"

  # BentoPDF, the self-hosted build
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:${BENTOPDF_VERSION:-v2.8.10}
    container_name: bentopdf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${BENTOPDF_PORT:-7003}:8080"

  # LibreSpeed: its upload endpoint reads the whole upload, so it measures right behind
  # a reverse proxy too
  librespeed:
    image: ghcr.io/librespeed/speedtest:${SPEEDTEST_VERSION:-6.3.1}
    container_name: librespeed
    restart: unless-stopped
    environment:
      - MODE=standalone
    ports:
      - "${SPEEDTEST_PORT:-7004}:8080"
