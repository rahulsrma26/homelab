# Stateless tools. Nothing here holds important data. Homepage has its own service:
# services/homepage.
services:
  # IT-Tools, the maintained fork (the original image hasn't been rebuilt since 2024);
  # it listens on 8080, not 80
  it-tools:
    image: ghcr.io/sharevb/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "${IT_TOOLS_PORT:-8081}:8080"

  # omni-tools: more everyday tools in the browser (images, video, audio, PDF, text, …)
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    ports:
      - "${OMNI_TOOLS_PORT:-8084}:80"

  # BentoPDF: PDF tools that run in the browser (merge, split, edit, sign, compress, OCR…).
  # The "simple" build = the self-hosted app without the bentopdf.com marketing pages
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - "${BENTOPDF_PORT:-8083}:8080"

  openspeedtest:
    image: openspeedtest/latest
    container_name: openspeedtest
    restart: unless-stopped
    ports:
      - "3080:3000"
      - "3081:3001"
