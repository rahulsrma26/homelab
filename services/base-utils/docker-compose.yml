# Stateless tools + Homepage. Nothing here holds important data: Homepage's config and
# Stirling PDF's settings are small folders in this service folder.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      PUID: 1000
      PGID: 1000
    volumes:
      - ./homepage/config:/app/config
      - ./homepage/images:/app/public/images

  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "8081:80"

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - DISABLE_ADDITIONAL_FEATURES=false
      - LANGS=${STIRLING_LANGS}
      - TZ=${TZ}
    volumes:
      - ./stirling-pdf/trainingData:/usr/share/tessdata    # extra OCR languages
      - ./stirling-pdf/extraConfigs:/configs
      - ./stirling-pdf/customFiles:/customFiles/
      - ./stirling-pdf/pipeline:/pipeline/

  openspeedtest:
    image: openspeedtest/latest
    container_name: openspeedtest
    restart: unless-stopped
    ports:
      - "3080:3000"
      - "3081:3001"
