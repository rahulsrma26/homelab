# Trilium Notes (TriliumNext). Everything is in its data folder (SQLite + attachments).
services:
  trilium:
    image: triliumnext/trilium:${TRILIUM_VERSION:-v0.107.0@sha256:739ba0f0488f506549f7c21dc9e792decd99382cc759f01d5ec1abba32e87da8}
    container_name: trilium
    restart: unless-stopped
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
    ports:
      - "${PORT:-8085}:8080"
    volumes:
      - ./data:/home/node/trilium-data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
