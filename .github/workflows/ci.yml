# Checks on every push to dev and every pull request: the same tests you run locally with
# make. When all of them pass on dev, "promote" fast-forwards main to that commit — main is
# what machines install and update from (labber, the curl one-liners), so they only ever
# get commits that passed CI. Nobody pushes to main directly (the pre-push hook refuses).
# The VM integration tests (make test-labber-vm) need the test VM and stay manual.
name: ci

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-lint:
    name: repo rules (.env templates, compose vars, no private IPs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/repo/lint.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/repo/shellcheck.sh

  labber-unit:
    name: labber unit tests + Alloy configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/labber/run-unit.sh

  labber-setup:
    name: labber setup in a fresh container (${{ matrix.mode }} path)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [lxc, vm]
    steps:
      - uses: actions/checkout@v5
      - run: tests/labber/run-setup.sh ${{ matrix.mode }}

  monitoring:
    name: Prometheus rules + Alertmanager config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/monitoring/run.sh

  scripts:
    name: scripts/ (NUT with a simulated UPS, Samba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/scripts/run-nut.sh
      - run: tests/scripts/run-samba.sh

  # all of the above passed on dev → main = this commit (fast-forward only: if main has
  # moved on its own, this fails instead of overwriting it)
  promote:
    name: promote to main (stable)
    needs: [repo-lint, shellcheck, labber-unit, labber-setup, monitoring, scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits that dev doesn't — not overwriting it. Merge main into dev (or reset main) by hand."
            exit 1
          fi
          git push origin HEAD:refs/heads/main
          echo "main → $(git rev-parse --short HEAD)"

