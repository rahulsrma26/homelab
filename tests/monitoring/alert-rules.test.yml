# promtool unit tests for services/monitoring/config/prometheus/alert.rules.yml
# Run: tests/monitoring/run.sh
rule_files:
  - /rules/alert.rules.yml

evaluation_interval: 1m

tests:
  # a Proxmox host goes silent with its two guests: one alert, the host's. A guest that dies on
  # its own (its host fine) alerts by itself. A guest without a pve-exporter entry still alerts.
  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{instance="od01"}'
        values: '100x30'
      - series: 'node_boot_time_seconds{instance="Immich"}'
        values: '100x30'
      - series: 'node_boot_time_seconds{instance="gpu-ms01"}'
        values: '100x30'
      - series: 'node_boot_time_seconds{instance="ms01"}'
        values: '100x120'
      - series: 'node_boot_time_seconds{instance="stray"}'
        values: '100x30'
      # pve-exporter's guest list stops with od01 (it can't be asked), ms01's goes on
      - series: 'pve_guest_info{name="Immich",node="od01",id="lxc/1011"}'
        values: '1x30'
      - series: 'pve_guest_info{name="gpu-ms01",node="ms01",id="qemu/1054"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 45m
        alertname: HostNotReporting
        exp_alerts:
          - exp_labels: {severity: critical, instance: od01}
            exp_annotations: {summary: "od01 stopped sending metrics (down, or Alloy stopped)"}
          - exp_labels: {severity: critical, instance: gpu-ms01}
            exp_annotations: {summary: "gpu-ms01 stopped sending metrics (down, or Alloy stopped)"}
          - exp_labels: {severity: critical, instance: stray}
            exp_annotations: {summary: "stray stopped sending metrics (down, or Alloy stopped)"}

  # a pushing host that stops sending metrics at minute 30 must alert; a healthy one must not
  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{instance="dies"}'
        values: '100x30'          # samples for minutes 0..30, then nothing
      - series: 'node_boot_time_seconds{instance="healthy"}'
        values: '100x1600'
    alert_rule_test:
      - eval_time: 20m
        alertname: HostNotReporting
        exp_alerts: []
      - eval_time: 45m
        alertname: HostNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: dies
            exp_annotations:
              summary: "dies stopped sending metrics (down, or Alloy stopped)"
      - eval_time: 6h
        alertname: HostNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: dies
            exp_annotations:
              summary: "dies stopped sending metrics (down, or Alloy stopped)"
      - eval_time: 23h
        alertname: HostNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: dies
            exp_annotations:
              summary: "dies stopped sending metrics (down, or Alloy stopped)"
      # One day after its last sample, the host is forgotten even without recovery.
      - eval_time: 25h
        alertname: HostNotReporting
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{instance="recovers"}'
        values: '100x30 _x60 100x200'
    alert_rule_test:
      - eval_time: 40m
        alertname: HostNotReporting
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: recovers
            exp_annotations:
              summary: "recovers stopped sending metrics (down, or Alloy stopped)"
      - eval_time: 100m
        alertname: HostNotReporting
        exp_alerts: []

  # reboot needed: only after a full day (one sample a minute, like a live host —
  # sparser samples go stale after 5 minutes and reset the timer)
  - interval: 1m
    input_series:
      - series: 'labber_reboot_required{instance="vm1"}'
        values: '1x1600'
    alert_rule_test:
      - eval_time: 12h
        alertname: RebootRequired
        exp_alerts: []
      - eval_time: 25h
        alertname: RebootRequired
        exp_alerts:
          - exp_labels:
              severity: info
              instance: vm1
            exp_annotations:
              summary: "vm1 has had a newer kernel or GPU driver installed for over a day — reboot it"

  # a failed unit for 15 minutes
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{instance="vm1",name="nginx.service",state="failed"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SystemdUnitFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: vm1
              name: nginx.service
              state: failed
            exp_annotations:
              summary: "Service nginx.service failed on vm1"

  # security updates pending for a week
  - interval: 1m
    input_series:
      - series: 'labber_security_updates_pending{instance="vm1"}'
        values: '3x12000'
    alert_rule_test:
      - eval_time: 3d
        alertname: SecurityUpdatesStuck
        exp_alerts: []
      - eval_time: 8d
        alertname: SecurityUpdatesStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: vm1
            exp_annotations:
              summary: "vm1: 3 security update(s) pending for a week — automatic updates may be failing"

  # a container restarting every 4 minutes
  - interval: 1m
    input_series:
      - series: 'container_start_time_seconds{job="guest-containers",instance="vm1",name="paperless"}'
        values: '100x3 340x3 580x3 820x3 1060x10'
    alert_rule_test:
      - eval_time: 14m
        alertname: ContainerRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              job: guest-containers
              instance: vm1
              name: paperless
            exp_annotations:
              summary: "Container paperless on vm1 restarted 3 times in 15 minutes"

  # a container that disappears at minute 20
  - interval: 1m
    input_series:
      - series: 'container_last_seen{job="guest-containers",instance="vm1",name="jellyfin"}'
        values: '1x20'
      - series: 'container_last_seen{job="guest-containers",instance="vm1",name="stays"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerGone
        exp_alerts: []
      - eval_time: 28m
        alertname: ContainerGone
        exp_alerts:
          - exp_labels:
              severity: info
              instance: vm1
              name: jellyfin
            exp_annotations:
              summary: "Container jellyfin on vm1 stopped (or was removed)"

  # an update available for a day
  - interval: 1m
    input_series:
      - series: 'labber_service_update_available{instance="vm1",service="metube",kind="image"}'
        values: '1x1600'
      - series: 'labber_service_update_available{instance="vm1",service="metube",kind="config"}'
        values: '0x1600'
    alert_rule_test:
      - eval_time: 25h
        alertname: ServiceUpdateAvailable
        exp_alerts:
          - exp_labels:
              severity: info
              instance: vm1
              service: metube
            exp_annotations:
              summary: "metube on vm1 has an update — labber metube update"

  # ECC: any uncorrectable error alerts; corrected errors only when they keep coming
  - interval: 1m
    input_series:
      - series: 'node_edac_uncorrectable_errors_total{instance="od01",controller="0"}'
        values: '0x10 1x50'
      - series: 'node_edac_correctable_errors_total{instance="od01",controller="0"}'
        values: '0x10 1x50'                      # a single corrected error: fine
      - series: 'node_edac_correctable_errors_total{instance="bad",controller="0"}'
        values: '0+1x60'                         # one more every minute: a failing module
    alert_rule_test:
      - eval_time: 5m
        alertname: MemoryUncorrectableError
        exp_alerts: []
      - eval_time: 20m
        alertname: MemoryUncorrectableError
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: od01
              controller: "0"
            exp_annotations:
              summary: "Uncorrectable memory (ECC) error on od01, memory controller 0"
      - eval_time: 30m
        alertname: MemoryCorrectableErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: bad
              controller: "0"
            exp_annotations:
              summary: "30 corrected memory (ECC) errors in 24h on bad, memory controller 0"

  # a ZFS pool that leaves "online" for 5 minutes
  - interval: 1m
    input_series:
      - series: 'node_zfs_zpool_state{instance="od01",zpool="spool",state="online"}'
        values: '1x10 0x20'
      - series: 'node_zfs_zpool_state{instance="od01",zpool="spool",state="degraded"}'
        values: '0x10 1x20'
      - series: 'node_zfs_zpool_state{instance="od01",zpool="rpool",state="online"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 13m
        alertname: ZfsPoolNotOnline
        exp_alerts: []
      - eval_time: 20m
        alertname: ZfsPoolNotOnline
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: od01
              zpool: spool
              state: degraded
            exp_annotations:
              summary: "ZFS pool spool on od01 is degraded"

  # disk space steps: 50% → 85% → 92% → 97% used, an hour each (size 100, so avail = 100 - used)
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="od01",mountpoint="/data",fstype="zfs"}'
        values: '100x240'
      - series: 'node_filesystem_avail_bytes{instance="od01",mountpoint="/data",fstype="zfs"}'
        values: '50x60 15x60 8x60 3x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: DiskSpaceLow
        exp_alerts: []
      - eval_time: 80m            # 85% for 19 min: not yet (30 min)
        alertname: DiskSpaceLow
        exp_alerts: []
      - eval_time: 100m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels: {severity: info, mountpoint: /data, fstype: zfs, instance: od01}
            exp_annotations: {summary: "Disk /data on od01 at 85%, filling up"}
      - eval_time: 100m
        alertname: DiskSpaceCritical
        exp_alerts: []
      - eval_time: 130m
        alertname: DiskSpaceCritical
        exp_alerts:
          - exp_labels: {severity: critical, mountpoint: /data, fstype: zfs, instance: od01}
            exp_annotations: {summary: "Disk /data on od01 at 92%"}
      - eval_time: 130m
        alertname: DiskSpaceFull
        exp_alerts: []
      - eval_time: 190m
        alertname: DiskSpaceFull
        exp_alerts:
          - exp_labels: {severity: critical, mountpoint: /data, fstype: zfs, instance: od01}
            exp_annotations: {summary: "Disk /data on od01 nearly full: 97%"}

  # filling fast: 60% used and losing 1 a minute (empty in ~7 h) must alert after an hour;
  # a steady 70% disk and a slowly filling one (a year to go) must not
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="od01",mountpoint="/fast",fstype="zfs"}'
        values: '1000x400'
      - series: 'node_filesystem_avail_bytes{instance="od01",mountpoint="/fast",fstype="zfs"}'
        values: '400-1x380'
      - series: 'node_filesystem_size_bytes{instance="od01",mountpoint="/steady",fstype="zfs"}'
        values: '1000000x400'
      - series: 'node_filesystem_avail_bytes{instance="od01",mountpoint="/steady",fstype="zfs"}'
        values: '300000x400'
      - series: 'node_filesystem_size_bytes{instance="od01",mountpoint="/slow",fstype="zfs"}'
        values: '1000000x400'
      - series: 'node_filesystem_avail_bytes{instance="od01",mountpoint="/slow",fstype="zfs"}'
        values: '400000-1x400'
    alert_rule_test:
      - eval_time: 30m
        alertname: DiskFillingFast
        exp_alerts: []
      - eval_time: 90m
        alertname: DiskFillingFast
        exp_alerts:
          - exp_labels: {severity: critical, mountpoint: /fast, fstype: zfs, instance: od01}
            exp_annotations: {summary: "Disk /fast on od01 will be full within a day at the rate of the last 6 h"}
      - eval_time: 300m
        alertname: DiskFillingFast
        exp_alerts:
          - exp_labels: {severity: critical, mountpoint: /fast, fstype: zfs, instance: od01}
            exp_annotations: {summary: "Disk /fast on od01 will be full within a day at the rate of the last 6 h"}


  # GPU: 95 °C alerts at once; 90 °C needs 15 minutes without a break; 89 °C never
  - interval: 1m
    input_series:
      - series: 'gpu_temperature_celsius{instance="peak",gpu="0",name="Test GPU"}'
        values: '70x5 96 70x30'
      - series: 'gpu_temperature_celsius{instance="sustained",gpu="0",name="Test GPU"}'
        values: '70x5 91x8 70 91x20'
      - series: 'gpu_temperature_celsius{instance="warm",gpu="0",name="Test GPU"}'
        values: '89x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: GPUTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: critical, instance: peak, gpu: "0", name: Test GPU}
            exp_annotations: {summary: "GPU Test GPU on peak is at 96 °C (95 °C, or 90 °C for 15 minutes)"}
      # 8 minutes at 91, a dip, then 91 again: nothing until 15 unbroken minutes (minute 30)
      - eval_time: 20m
        alertname: GPUTemperatureHigh
        exp_alerts: []
      - eval_time: 31m
        alertname: GPUTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: critical, instance: sustained, gpu: "0", name: Test GPU}
            exp_annotations: {summary: "GPU Test GPU on sustained is at 91 °C (95 °C, or 90 °C for 15 minutes)"}

  # logs (the counters start rising at minute 11): a capped host alerts, a quiet one doesn't; lost lines
  # and Loki rejections alert at once;
  # heavy logging alerts only after 15 sustained minutes
  - interval: 1m
    input_series:
      - series: 'loki_process_dropped_lines_total{host="noisy",reason="ratelimit_drop_stage"}'
        values: '0+0x10 0+500x20'
      - series: 'loki_process_dropped_lines_total{host="quiet",reason="noise"}'
        values: '0+50x30'
      - series: 'loki_write_dropped_entries_total{host="noisy",reason="rate_limited"}'
        values: '0x10 0+20x20'
      - series: 'loki_write_sent_bytes_total{host="noisy"}'
        values: '0+12000000x60'
      - series: 'loki_write_sent_bytes_total{host="quiet"}'
        values: '0+60000x60'
      - series: 'loki_discarded_samples_total{reason="per_stream_rate_limit"}'
        values: '0x10 0+5x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: LogsCapped
        exp_alerts: []
      - eval_time: 20m
        alertname: LogsCapped
        exp_alerts:
          - exp_labels: {severity: warning, host: noisy}
            exp_annotations: {summary: "noisy is logging more than its cap: 4.5k lines dropped in 15 minutes — check its noisiest container"}
      - eval_time: 20m
        alertname: LogsNotDelivered
        exp_alerts:
          - exp_labels: {severity: warning, host: noisy, reason: rate_limited}
            exp_annotations: {summary: "noisy: 180 log lines lost in 15 minutes (rate_limited)"}
      - eval_time: 10m
        alertname: LogFlood
        exp_alerts: []
      - eval_time: 35m
        alertname: LogFlood
        exp_alerts:
          - exp_labels: {severity: warning, host: noisy}
            exp_annotations: {summary: "noisy sends 200kB/s of logs — check its noisiest container"}
      - eval_time: 20m
        alertname: LokiRejectingLogs
        exp_alerts:
          - exp_labels: {severity: warning, reason: per_stream_rate_limit}
            exp_annotations: {summary: "Loki rejected 45 log lines in 15 minutes (per_stream_rate_limit)"}

  # DiskWritesSurge (hosts only, per disk serial): 8 days at 10 GB/day, then 100 GB/day → warning;
  # a disk that always writes 100 GB/day is normal for it; partitions and guests' (virtual) disks
  # are ignored; two disks swapping kernel names at a reboot (host r) → nothing
  - interval: 15m   # a 1 h rate needs two samples in the hour
    input_series:
      - series: 'node_disk_written_bytes_total{job="proxmox-node-exporters",instance="h",device="nvme0n1"}'
        values: '0+104166667x768 80000000256+1041666667x192'
      - series: 'node_disk_info{job="proxmox-node-exporters",instance="h",device="nvme0n1",serial="S1",model="M1"}'
        values: '1x960'
      - series: 'node_disk_written_bytes_total{job="proxmox-node-exporters",instance="h",device="sda"}'
        values: '0+1041666667x960'
      - series: 'node_disk_info{job="proxmox-node-exporters",instance="h",device="sda",serial="S2",model="M2"}'
        values: '1x960'
      - series: 'node_disk_written_bytes_total{job="proxmox-node-exporters",instance="h",device="nvme0n1p3"}'
        values: '0+104166667x768 80000000256+1041666667x192'
      - series: 'node_disk_written_bytes_total{job="guest-node-exporters",instance="vm",device="sda"}'
        values: '0+104166667x768 80000000256+1041666667x192'
      - series: 'node_disk_info{job="guest-node-exporters",instance="vm",device="sda",serial="V1",model="QEMU"}'
        values: '1x960'
      # host r: the quiet disk (A) was nvme0n1 and the busy one (B) nvme1n1; after a reboot at 8d, swapped
      - series: 'node_disk_written_bytes_total{job="proxmox-node-exporters",instance="r",device="nvme0n1"}'
        values: '0+104166667x768 0+1041666667x192'
      - series: 'node_disk_written_bytes_total{job="proxmox-node-exporters",instance="r",device="nvme1n1"}'
        values: '0+1041666667x768 0+104166667x192'
      - series: 'node_disk_info{job="proxmox-node-exporters",instance="r",device="nvme0n1",serial="A",model="MA"}'
        values: '1x768 _x192'
      - series: 'node_disk_info{job="proxmox-node-exporters",instance="r",device="nvme1n1",serial="B",model="MB"}'
        values: '1x768 _x192'
      - series: 'node_disk_info{job="proxmox-node-exporters",instance="r",device="nvme0n1",serial="B",model="MB"}'
        values: '_x768 1x192'
      - series: 'node_disk_info{job="proxmox-node-exporters",instance="r",device="nvme1n1",serial="A",model="MA"}'
        values: '_x768 1x192'
    alert_rule_test:
      - eval_time: 7d
        alertname: DiskWritesSurge
        exp_alerts: []
      - eval_time: 8d20h
        alertname: DiskWritesSurge
        exp_alerts:
          - exp_labels: {severity: warning, instance: h, serial: S1, model: M1}
            exp_annotations: {summary: "h M1 (S1) wrote 79.16GiB in 24 h, over 3× its usual day"}

  # HighMemory: a level held for 30 min, not a spike. A VM at 95% for 40 min → warning; one
  # touching 95% for 10 min → nothing; an LXC (from pve-exporter) at 95% → warning, named by
  # its guest name; a VM at 83% (e.g. 5 of 6 GB during a test) → nothing
  - interval: 1m
    input_series:
      - series: 'node_memory_MemTotal_bytes{instance="busyvm",job="guest-node-exporters"}'
        values: '100x60'
      - series: 'node_memory_MemAvailable_bytes{instance="busyvm",job="guest-node-exporters"}'
        values: '5x60'
      - series: 'node_memory_MemTotal_bytes{instance="spikyvm",job="guest-node-exporters"}'
        values: '100x60'
      - series: 'node_memory_MemAvailable_bytes{instance="spikyvm",job="guest-node-exporters"}'
        values: '50x20 5x10 50x30'
      - series: 'node_memory_MemTotal_bytes{instance="testvm",job="guest-node-exporters"}'
        values: '6x60'
      - series: 'node_memory_MemAvailable_bytes{instance="testvm",job="guest-node-exporters"}'
        values: '1x60'
      - series: 'pve_memory_usage_bytes{id="lxc/1013",instance="pve"}'
        values: '95x60'
      - series: 'pve_memory_size_bytes{id="lxc/1013",instance="pve"}'
        values: '100x60'
      - series: 'pve_guest_info{id="lxc/1013",instance="pve",name="Apps",node="od01",type="lxc"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: HighMemory
        exp_alerts: []
      - eval_time: 40m
        alertname: HighMemory
        exp_alerts:
          - exp_labels: {severity: warning, instance: busyvm, job: guest-node-exporters}
            exp_annotations: {summary: "busyvm has used over 90% of its memory for 30 min: 95%"}
          - exp_labels: {severity: warning, instance: Apps, id: lxc/1013, name: Apps}
            exp_annotations: {summary: "Apps has used over 90% of its memory for 30 min: 95%"}

  # the same full dataset seen by the host and by an LXC that mounts it: one alert, the host's;
  # a VM's own full disk still alerts
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="od01",mountpoint="/spool/encrypted/common",fstype="zfs"}'
        values: '3x20'
      - series: 'node_filesystem_size_bytes{instance="od01",mountpoint="/spool/encrypted/common",fstype="zfs"}'
        values: '100x20'
      - series: 'node_filesystem_avail_bytes{instance="Docs",kind="lxc",mountpoint="/mnt/inbox",fstype="zfs"}'
        values: '3x20'
      - series: 'node_filesystem_size_bytes{instance="Docs",kind="lxc",mountpoint="/mnt/inbox",fstype="zfs"}'
        values: '100x20'
      - series: 'node_filesystem_avail_bytes{instance="gpu",kind="vm",mountpoint="/",fstype="ext4"}'
        values: '3x20'
      - series: 'node_filesystem_size_bytes{instance="gpu",kind="vm",mountpoint="/",fstype="ext4"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: DiskSpaceFull
        exp_alerts:
          - exp_labels: {severity: critical, instance: od01, mountpoint: /spool/encrypted/common, fstype: zfs}
            exp_annotations: {summary: "Disk /spool/encrypted/common on od01 nearly full: 97%"}
          - exp_labels: {severity: critical, instance: gpu, kind: vm, mountpoint: /, fstype: ext4}
            exp_annotations: {summary: "Disk / on gpu nearly full: 97%"}
